version: '3.4'
services:
  floci:
    image: hectorvent/floci:latest-aws
    ports:
      - '4566:4566'
    env_file:
      - 'compose/aws.env'
    environment:
      FLOCI_DEFAULT_REGION: eu-west-2
    volumes:
      - ./compose/floci/start.d:/etc/floci/init/start.d:ro
    networks:
      - cdp-tenant

  redis:
    image: redis:7.2.3-alpine3.18
    ports:
      - '6379:6379'
    networks:
      - cdp-tenant

  mongodb:
    image: mongo:7.0.28
    networks:
      - cdp-tenant
    ports:
      - '27017:27017'
    volumes:
      - ./compose/mongo:/docker-entrypoint-initdb.d:ro
      - mongodb-data:/data
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  ################################################################################

  admin-frontend:
    build: ./
    ports:
      - '3000:3000'
    links:
      - 'floci:floci'
      - 'redis:redis'
      - 'cdp-uploader:cdp-uploader'
    # Docker Desktop resolves host.docker.internal already; Linux needs it
    # mapped explicitly for NRF_IMPACT_ASSESSOR_API_URL to reach the host.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_started
      cdp-uploader:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 3000
      NODE_ENV: production
      REDIS_HOST: redis
      LOG_FORMAT: pino-pretty
      SESSION_COOKIE_SECURE: false
      USE_SINGLE_INSTANCE_CACHE: true
      REDIS_TLS: false
      # Service-to-service API key for outbound backend calls (local dev only; real values come from CDP secrets)
      BACKEND_API_KEY: local-dev-backend-key
      UPLOAD_API_BEARER_TOKEN: ${UPLOAD_API_BEARER_TOKEN:-local-dev-token}
      CDP_UPLOADER_URL: http://cdp-uploader:7337
      # Must match the impact-assessor's DATA_SYNC_S3_BUCKET/DATA_SYNC_S3_PREFIX
      # so a dump uploaded here lands where that service resolves manifest keys.
      CDP_UPLOADER_S3_BUCKET: ${CDP_UPLOADER_BUCKET:-nrf-impact-assessor-files}
      CDP_UPLOADER_S3_PATH_PREFIX: ${CDP_UPLOADER_S3_PATH_PREFIX:-reference_data_backups}
      # The impact-assessor is not part of this compose file, so reach it on the
      # host rather than at localhost, which would resolve to this container.
      NRF_IMPACT_ASSESSOR_API_URL: ${NRF_IMPACT_ASSESSOR_API_URL:-http://host.docker.internal:8085}
      DATA_SYNC_TOKEN: ${DATA_SYNC_TOKEN:-local-dev-data-sync-token}
      # Reach floci's S3 API over the compose network (overrides aws.env's
      # localhost endpoint, which would resolve to this container).
      AWS_S3_ENDPOINT: http://floci:4566
    networks:
      - cdp-tenant

  # your-backend:
  #   image: defradigital/your-backend:${YOUR_BACKEND_VERSION:-latest}
  #   ports:
  #     - '3555:3555'
  #   links:
  #     - 'foci:floci'
  #     - 'mongodb:mongodb'
  #   depends_on:
  #     floci:
  #       condition: service_healthy
  #     mongodb:
  #       condition: service_started
  #   env_file:
  #     - 'compose/aws.env'
  #   environment:
  #     PORT: 3001
  #     NODE_ENV: development
  #     MONGO_URI: mongodb://mongodb:27017/
  #   networks:
  #     - cdp-tenant

  cdp-uploader:
    image: defradigital/cdp-uploader:${CDP_UPLOADER_VERSION:-latest}
    ports:
      - '7337:7337'
    links:
      - 'floci:floci'
      - 'redis:redis'
    depends_on:
      floci:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - 'compose/aws.env'
    environment:
      PORT: 7337
      NODE_ENV: development
      REDIS_HOST: redis
      USE_SINGLE_INSTANCE_CACHE: true
      MOCK_VIRUS_SCAN_ENABLED: true
      MOCK_VIRUS_RESULT_DELAY: 3
      SQS_ENDPOINT: http://floci:4566
      S3_ENDPOINT: http://floci:4566
      CONSUMER_BUCKETS: ${CDP_UPLOADER_BUCKET:-nrf-impact-assessor-files}
      # cdp-uploader defaults these to bare queue names, which the AWS SDK
      # cannot resolve against floci. Point them at full floci queue URLs
      # (account 000000000000 is the LocalStack default).
      SQS_SCAN_RESULTS: http://floci:4566/000000000000/cdp-clamav-results
      SQS_SCAN_RESULTS_CALLBACK: http://floci:4566/000000000000/cdp-uploader-scan-results-callback.fifo
      SQS_DOWNLOAD_REQUESTS: http://floci:4566/000000000000/cdp-uploader-download-requests
      SQS_MOCK_CLAMAV: http://floci:4566/000000000000/mock-clamav
    networks:
      - cdp-tenant

################################################################################

volumes:
  mongodb-data:

networks:
  cdp-tenant:
    driver: bridge
